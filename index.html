  <meta property="og:description" content="整合雲林在地 12 大職訓機構與大專院校課程連結，提供開訓日 7 個工作日前參訓備案檢核與退輔會職訓補助規定宣導。">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f8f4;
    }
    .iframe-mask-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .iframe-mask-container iframe {
      position: absolute;
      top: -38px;
      left: 0;
      width: 100%;
      height: calc(100% + 38px);
      border: none;
    }
    @media (max-width: 600px) {
      .iframe-mask-container iframe {
        top: -50px;
        height: calc(100% + 50px);
      }
    }
  </style>
</head>
<body>
  <div class="iframe-mask-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbxImRT6Untn1oGHDNdSbd-5bDphaWnUTlWg_2WeST2XGH1tL4vSoYAlIiD28dyvV7Uz7g/exec" 
      allow="clipboard-write *; geolocation *;">
    </iframe>
  </div>
</body>
